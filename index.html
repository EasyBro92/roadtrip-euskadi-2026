<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1A73E8" />
    <meta name="description" content="Easy Travel: planificador de viajes por carretera con mapa, itinerario, diario, copiloto y gestor de gastos. Funciona sin conexión." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Easy Travel" />
    <title>Easy Travel</title>
    <!--
      El tema se decide aquí, antes de pintar nada, y no cuando arranca React.
      De noche la app abría con un fogonazo en blanco hasta que el JS llegaba
      a ponerla en oscuro. Lee el mismo ajuste que useSettingsStore.
    -->
    <script>
      (function () {
        var tema = "auto";
        try {
          var guardado = JSON.parse(localStorage.getItem("roadtrip-euskadi-2026:settings") || "null");
          tema = (guardado && guardado.state && guardado.state.settings && guardado.state.settings.theme) || "auto";
        } catch (e) {}
        var oscuro = tema === "dark" || (tema === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", oscuro ? "dark" : "light");
      })();
    </script>
    <style>
      /* Portada de arranque: se ve mientras llega el JS y React la sustituye
         al montar. Va aquí dentro para no depender de ningún otro fichero. */
      html { background: #fafaf7; }
      html[data-theme="dark"] { background: #08090c; }
      .arranque { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 500 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #5f6368; }
      html[data-theme="dark"] .arranque { color: #a1a8b3; }
      .arranque img { width: 72px; height: 72px; border-radius: 18px; }
      .arranque i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #1a73e8; border-top-color: transparent; animation: arranque-gira 0.8s linear infinite; }
      @keyframes arranque-gira { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .arranque i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="arranque" role="status" aria-label="Abriendo Easy Travel">
        <img src="/icons/icon.svg" alt="" />
        <span>Easy Travel</span>
        <i></i>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
