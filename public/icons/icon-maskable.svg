<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="skyMask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D93FF" />
      <stop offset="100%" stop-color="#0B4FCC" />
    </linearGradient>
  </defs>
  <!-- Fondo a sangre: Android recorta esta imagen con la forma que quiera
       (círculo, cuadrado redondeado, gota), así que no lleva esquinas propias. -->
